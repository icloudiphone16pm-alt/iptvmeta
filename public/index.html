<style>

/* ===== META PLAY 3.11 - RESPONSIVE DESKTOP + MOBILE ===== */
* { box-sizing: border-box; }
html, body { max-width:100%; overflow-x:hidden; }
img { max-width:100%; }

@media (max-width: 900px) {
  body { min-width:0 !important; }
  header, .header, nav, .topbar {
    min-height:56px !important;
    height:auto !important;
    padding:10px 14px !important;
    gap:10px !important;
    flex-wrap:wrap !important;
  }
  .logo, .brand, .site-logo { font-size:22px !important; }
  .sidebar, aside {
    width:100% !important;
    max-width:none !important;
    height:auto !important;
    position:relative !important;
    left:auto !important;
    top:auto !important;
    border-right:0 !important;
    border-bottom:1px solid rgba(255,255,255,.08) !important;
    overflow-x:auto !important;
    overflow-y:hidden !important;
  }
  .sidebar ul, aside ul, .categories {
    display:flex !important;
    flex-wrap:nowrap !important;
    gap:6px !important;
    padding:8px 10px !important;
    margin:0 !important;
    overflow-x:auto !important;
  }
  .sidebar li, aside li, .category {
    flex:0 0 auto !important;
    white-space:nowrap !important;
    padding:9px 12px !important;
  }
  main, .main, .content, .page-content {
    width:100% !important;
    margin-left:0 !important;
    padding:14px !important;
  }
  .content-header, .page-header, .toolbar {
    display:flex !important;
    flex-direction:column !important;
    align-items:stretch !important;
    gap:10px !important;
  }
  input, .search, .search-box {
    width:100% !important;
    max-width:none !important;
  }
  .grid, .channels-grid, .cards, .movies-grid, .series-grid {
    grid-template-columns:repeat(2,minmax(0,1fr)) !important;
    gap:9px !important;
  }
  .card, .channel-card, .movie-card, .series-card {
    min-width:0 !important;
    width:100% !important;
  }
  .card img, .channel-card img, .movie-card img, .series-card img {
    width:100% !important;
    height:auto !important;
    aspect-ratio:16/9 !important;
    object-fit:contain !important;
  }
  .card-title, .channel-name, .movie-title, .series-title {
    font-size:13px !important;
    line-height:1.25 !important;
  }
  .modal, .player-modal, .video-modal {
    width:calc(100vw - 20px) !important;
    max-width:none !important;
    max-height:calc(100vh - 20px) !important;
    margin:10px !important;
  }
  .modal video, .player-modal video, video {
    width:100% !important;
    max-height:60vh !important;
  }
}

@media (max-width: 520px) {
  header, .header, nav, .topbar { padding:8px 10px !important; }
  main, .main, .content, .page-content { padding:10px !important; }
  .grid, .channels-grid, .cards, .movies-grid, .series-grid {
    grid-template-columns:repeat(2,minmax(0,1fr)) !important;
    gap:7px !important;
  }
  .card-title, .channel-name, .movie-title, .series-title {
    font-size:12px !important;
  }
  .sidebar li, aside li, .category { padding:8px 10px !important; font-size:12px !important; }
}

/* Phones in landscape can use 3 columns */
@media (max-width: 900px) and (orientation:landscape) {
  .grid, .channels-grid, .cards, .movies-grid, .series-grid {
    grid-template-columns:repeat(3,minmax(0,1fr)) !important;
  }
}

/* Prevent accidental horizontal overflow from fixed player widths */
@media (max-width: 900px) {
  .player, .video-container, .modal-content, .player-container {
    width:100% !important;
    max-width:100% !important;
  }
}

</style>

<script>
(()=>{"use strict";
const $=id=>document.getElementById(id), esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const S={server:"",user:"",pass:"",page:"live",cat:"all",view:"all",items:[],groups:[],target:"",current:null};let player=null;
const SESSION_KEY="metaPlaySessionV3160";
const FAV_KEY="metaPlayFavoritesV315";
const HISTORY_KEY="metaPlayHistoryV315";
const PROGRESS_KEY="metaPlayProgressV315";
const LEGACY_SESSION_KEYS=["metaPlaySessionV3150","metaPlaySessionV3140","metaPlaySessionV3133","metaPlaySessionV3132","metaPlaySessionV3131","metaPlaySessionV313"];
const post=async(u,b)=>{const r=await fetch(u,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)});return r.json()};
const creds=()=>({server:$("server").value.trim(),user:$("user").value.trim(),pass:$("pass").value});
function saveSession(c){
  try{
    const payload={server:c.server,user:c.user,pass:c.pass,savedAt:Date.now()};
    localStorage.setItem(SESSION_KEY,JSON.stringify(payload));
    for(const k of LEGACY_SESSION_KEYS)localStorage.removeItem(k);
  }catch{}
}
function getSession(){
  try{
    const keys=[SESSION_KEY,...LEGACY_SESSION_KEYS];
    for(const k of keys){
      const raw=localStorage.getItem(k);if(!raw)continue;
      const x=JSON.parse(raw);
      if(x&&x.server&&x.user&&x.pass){
        if(k!==SESSION_KEY)saveSession(x);
        return x;
      }
    }
  }catch{}
  return null;
}
function clearSession(){try{localStorage.removeItem(SESSION_KEY);for(const k of LEGACY_SESSION_KEYS)localStorage.removeItem(k)}catch{}}
function restoreSessionUI(c){
  Object.assign(S,{server:c.server,user:c.user,pass:c.pass});
  $("server").value=c.server;$("user").value=c.user;$("pass").value=c.pass;
  $("account").textContent=c.user;
  $("loginPage").classList.add("hide");$("app").classList.remove("hide");
}
async function doLogin(c,{silent=false,keepOnFailure=false}={}){
  if(!c.server||!c.user||!c.pass){if(!silent){$("result").textContent="Preencha servidor, usuário e senha.";$("result").className="result show bad"}return false}
  try{
    if(silent)restoreSessionUI(c);
    const d=await post("/api/login",c);
    if(!d.ok){
      if(!keepOnFailure){$("loginPage").classList.remove("hide");$("app").classList.add("hide")}
      else {$("loginPage").classList.add("hide");$("app").classList.remove("hide")}
      if(!silent){$("result").textContent=JSON.stringify(d,null,2);$("result").className="result show bad"}
      return false
    }
    const normalized={...c,server:d.server||c.server};
    Object.assign(S,normalized);saveSession(normalized);
    $("server").value=normalized.server;$("user").value=normalized.user;$("pass").value=normalized.pass;
    $("account").textContent=d.user_info.username||S.user;
    $("loginPage").classList.add("hide");$("app").classList.remove("hide");
    await load();return true
  }catch(e){
    if(!keepOnFailure){$("loginPage").classList.remove("hide");$("app").classList.add("hide")}
    if(!silent){$("result").textContent=e.message;$("result").className="result show bad"}
    return false
  }
}
$("test").onclick=async()=>{const c=creds();$("result").textContent="Verificando...";$("result").className="result show ok";try{const d=await post("/api/test",c);$("result").textContent=JSON.stringify(d,null,2);$("result").className="result show "+(d.ok?"ok":"bad")}catch(e){$("result").textContent=e.message;$("result").className="result show bad"}};
$("enter").onclick=()=>doLogin(creds());
const tp=$("togglePassV44");if(tp)tp.onclick=()=>{$("pass").type=$("pass").type==="password"?"text":"password";};
async function list(a){const d=await post("/api/list",{server:S.server,user:S.user,pass:S.pass,action:a});if(!d.ok)throw Error(d.error||"Erro na API");return d.data}
async function seriesInfo(series_id){const d=await post("/api/series-info",{server:S.server,user:S.user,pass:S.pass,series_id});if(!d.ok)throw Error(d.error||"Não foi possível carregar a série");return d.data}
async function epgInfo(stream_id){const d=await post("/api/epg",{server:S.server,user:S.user,pass:S.pass,stream_id,limit:6});return d.ok?d.data:[]}
function readStore(k,fallback){try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(fallback))}catch{return fallback}}
function writeStore(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
function itemKey(x,page=S.page){return page+":"+String(x.stream_id||x.series_id||x.name||"")}
function favorites(){return readStore(FAV_KEY,{})}
function history(){return readStore(HISTORY_KEY,[])}
function progresses(){return readStore(PROGRESS_KEY,{})}
function isFav(x){return !!favorites()[itemKey(x)]}
function toggleFav(x){const f=favorites(),k=itemKey(x);if(f[k])delete f[k];else f[k]={...x,_page:S.page,_saved:Date.now()};writeStore(FAV_KEY,f);updateFavCount();render()}
function addHistory(x){let h=history();const k=itemKey(x);h=h.filter(i=>itemKey(i,i._page)!==k);h.unshift({...x,_page:S.page,_played:Date.now()});writeStore(HISTORY_KEY,h.slice(0,60));}
function updateFavCount(){$("favCount").textContent=Object.keys(favorites()).length}
async function load(){$("grid").innerHTML='<div class="empty">Carregando...</div>';try{if(S.page==="live"){S.groups=await list("get_live_categories");S.items=await list("get_live_streams")}else if(S.page==="movies"){S.groups=await list("get_vod_categories");S.items=await list("get_vod_streams")}else{S.groups=await list("get_series_categories");S.items=await list("get_series")}S.cat="all";renderCats();render()}catch(e){$("grid").innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
function renderCats(){const a=[{category_id:"all",category_name:"Todas"},...S.groups];$("cats").innerHTML=a.map(g=>`<button class="cat ${String(g.category_id)===S.cat?"active":""}" data-cat="${esc(g.category_id)}">${esc(g.category_name||"Sem nome")}</button>`).join("");document.querySelectorAll(".cat").forEach(b=>b.onclick=()=>{S.cat=b.dataset.cat;renderCats();render()})}
const LOGO_FALLBACKS={
  globo:"https://commons.wikimedia.org/wiki/Special:Redirect/file/TV_Globo_logo_(April_2025).svg",
  band:"https://commons.wikimedia.org/wiki/Special:Redirect/file/Band_Marca.svg",
  sbt:"https://commons.wikimedia.org/wiki/Special:Redirect/file/SBT-Logotipo-2021.png",
  record:"https://commons.wikimedia.org/wiki/Special:Redirect/file/RecordTV_logo.svg",
  redetv:"https://commons.wikimedia.org/wiki/Special:Redirect/file/RedeTV!_logo.svg",
  cultura:"https://commons.wikimedia.org/wiki/Special:Redirect/file/Cultura_logo_2013.svg",
  jovempan:"https://commons.wikimedia.org/wiki/Special:Redirect/file/Jovem_Pan_logo_2018.svg",
  animalplanet:"https://commons.wikimedia.org/wiki/Special:Redirect/file/Animal_Planet_logo.svg",
  axn:"https://commons.wikimedia.org/wiki/Special:Redirect/file/AXN_logo.svg",
  hbo:"https://commons.wikimedia.org/wiki/Special:Redirect/file/HBO_logo.svg",
  discovery:"https://commons.wikimedia.org/wiki/Special:Redirect/file/Discovery_Channel_-_Logo_2019.svg",
  tnt:"https://commons.wikimedia.org/wiki/Special:Redirect/file/TNT_Logo_2016.svg",
  cartoonnetwork:"https://commons.wikimedia.org/wiki/Special:Redirect/file/Cartoon_Network_2010_logo.svg",
  multishow:"https://commons.wikimedia.org/wiki/Special:Redirect/file/Multishow.svg",
  cnnbrasil:"https://commons.wikimedia.org/wiki/Special:Redirect/file/CNN_Brasil_Logo.png"
};
function normName(name){return String(name||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/^br\s*:\s*/i,"").replace(/\b(uhd|fhd|4k|hd|sd)\b/g," ").replace(/[^a-z0-9]+/g," ").trim()}
function fallbackLogo(name){
  const n=normName(name);
  const rules=[
    [/\b(globo|globoplay|globo news|gshow)\b/,"globo"],
    [/\b(band|bandeirantes|band sports|band sport)\b/,"band"],
    [/\bsbt\b/,"sbt"],
    [/\b(record|record news|recordtv)\b/,"record"],
    [/(redetv|rede tv)/,"redetv"],
    [/\bcultura\b/,"cultura"],
    [/\b(jovem pan|jp news)\b/,"jovempan"],
    [/\banimal planet\b/,"animalplanet"],
    [/\baxn\b/,"axn"],
    [/\bhbo\b/,"hbo"],
    [/\bdiscovery( channel| h&h| home| science| kids)?\b/,"discovery"],
    [/\btnt\b/,"tnt"],
    [/\bcartoon network\b/,"cartoonnetwork"],
    [/\bmultishow\b/,"multishow"],
    [/\bcnn brasil\b/,"cnnbrasil"]
  ];
  for(const [re,key] of rules)if(re.test(n))return LOGO_FALLBACKS[key];
  return "";
}
function initials(name){
  const words=String(name||"TV").trim().split(/\s+/).filter(Boolean).filter(w=>!/^br:$/i.test(w));
  const clean=words.map(w=>w.replace(/[^a-zA-ZÀ-ÿ0-9]/g,"" )).filter(Boolean);
  return (clean.length>1?clean.slice(0,2).map(w=>w[0]).join(""):String(clean[0]||"TV").slice(0,2)).toUpperCase();
}
function makeLogo(x){
  const thumb=document.createElement("div");thumb.className="thumb";
  const name=String(x.name||"Canal");
  const supplied=String(x.stream_icon||x.cover||"").trim();
  const fallback=fallbackLogo(name);
  const urls=[];
  for(const u of [supplied,fallback]){if(u && !urls.includes(u))urls.push(u)}
  const img=document.createElement("img");img.loading="lazy";img.alt=name;img.decoding="async";img.referrerPolicy="no-referrer";
  let tried=0;
  const next=()=>{
    if(tried>=urls.length){
      const ph=document.createElement("span");ph.className="placeholder";ph.textContent=initials(name);thumb.replaceChildren(ph);return;
    }
    const u=urls[tried++];
    img.classList.toggle("fallback-logo", tried>1 || u===fallback);
    img.src="/image?url="+encodeURIComponent(u);
  };
  img.addEventListener("error",next);
  thumb.appendChild(img);next();return thumb;
}
function render(){
  const q=$("search").value.toLowerCase();
  let source=S.items;
  if(S.view==="favorites")source=Object.values(favorites()).filter(x=>x._page===S.page);
  if(S.view==="recent")source=history().filter(x=>x._page===S.page);
  const a=source.filter(x=>(S.view!=="all"||S.cat==="all"||String(x.category_id)===S.cat)&&(!q||String(x.name||"").toLowerCase().includes(q)));
  const baseTitle=S.page==="live"?"TV ao vivo":S.page==="movies"?"Filmes":"Séries";
  $("title").textContent=S.view==="favorites"?"Favoritos — "+baseTitle:S.view==="recent"?"Recentes — "+baseTitle:baseTitle;
  $("sub").textContent=a.length+" item(ns)";
  const recent=history().find(x=>x._page===S.page);
  const strip=$("recentStrip");
  if(S.view==="all"&&recent){strip.classList.remove("hide");strip.innerHTML='Último acesso: <b>'+esc(recent.name||"Conteúdo")+'</b> — clique em Recentes para ver o histórico.'}else strip.classList.add("hide");
  const grid=$("grid");grid.replaceChildren();
  if(!a.length){grid.innerHTML='<div class="empty">Nenhum conteúdo nesta seção.</div>';return}
  const pg=progresses();
  a.forEach(x=>{
    const card=document.createElement("article");card.className="card";
    const fb=document.createElement("button");fb.className="favbtn"+(isFav(x)?" on":"");fb.textContent=isFav(x)?"★":"☆";fb.title="Favoritar";fb.onclick=e=>{e.stopPropagation();toggleFav(x)};card.appendChild(fb);
    card.appendChild(makeLogo(x));
    const body=document.createElement("div");body.className="body";
    const nm=document.createElement("div");nm.className="name";nm.textContent=x.name||"Sem nome";
    const meta=document.createElement("div");meta.className="meta";meta.textContent=x.category_name||((x._page||S.page)==="live"?"TV ao vivo":(x._page||S.page)==="movies"?"Filme":"Série");
    body.append(nm,meta);
    const pr=pg[itemKey(x,x._page||S.page)];if(pr&&pr.duration>30){const pct=Math.max(0,Math.min(100,(pr.current/pr.duration)*100));const bar=document.createElement("div");bar.className="progress";bar.innerHTML='<i style="width:'+pct+'%"></i>';body.appendChild(bar)}
    card.appendChild(body);card.onclick=()=>play(x);grid.appendChild(card)
  })
}
function destroy(){
  if(player){try{player.destroy()}catch{}player=null}
  const v=$("video");
  try{v.pause()}catch{}
  v.removeAttribute("src");
  v.removeAttribute("crossorigin");
  v.load();
}

function isMobile(){return /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)||window.matchMedia("(max-width:900px)").matches}
function isHls(u){return /\.m3u8(?:\?|$)/i.test(u)}
function isTs(u){return /\.(ts|mpegts)(?:\?|$)/i.test(u)||/\/live\//i.test(u)}

function playLive(target){
  destroy();
  const src=new URL("/stream?url="+encodeURIComponent(target),window.location.href).toString();
  const v=$("video");
  const mobile=isMobile();
  $("perror").textContent="";
  $("loading").classList.remove("hide");

  // HLS: use the browser's native HLS implementation first on iPhone/iPad.
  if(isHls(target)){
    if(v.canPlayType("application/vnd.apple.mpegurl")){
      v.src=src;
      v.addEventListener("loadedmetadata",()=>v.play().catch(()=>{}),{once:true});
      return;
    }
    if(window.Hls && Hls.isSupported()){
      player=new Hls({enableWorker:!mobile,lowLatencyMode:false,maxBufferLength:30,maxMaxBufferLength:60});
      player.loadSource(src); player.attachMedia(v);
      player.on(Hls.Events.MANIFEST_PARSED,()=>v.play().catch(()=>{}));
      player.on(Hls.Events.ERROR,(_,d)=>{if(d&&d.fatal){$("loading").classList.add("hide");$("perror").textContent="Erro HLS: "+(d.details||d.type||"falha")}});
      return;
    }
  }

  // iPhone/iPad Safari cannot use mpegts.js/MSE for raw MPEG-TS. Ask the
  // Meta Play server to create a temporary HLS playlist with FFmpeg.
  if(isTs(target) && /iPhone|iPad|iPod/i.test(navigator.userAgent)){
    (async()=>{
      try{
        const r=await post("/api/mobile-hls",{
          url:target,server:S.server,user:S.user,pass:S.pass,stream_id:S.current&&S.current.stream_id,ext:(S.current&&S.current.container_extension)||"ts"
        });
        if(!r.ok||!r.playlist)throw new Error((r.error||"Falha ao iniciar HLS")+(r.detail?"\n"+r.detail:""));
        const hlsUrl=new URL(r.playlist,window.location.href).toString();
        if(v.canPlayType("application/vnd.apple.mpegurl")){
          v.src=hlsUrl;
          v.addEventListener("loadedmetadata",()=>{$("loading").classList.add("hide");v.play().catch(()=>{})},{once:true});
          v.addEventListener("playing",()=>$("loading").classList.add("hide"),{once:true});
          v.addEventListener("error",()=>{$("loading").classList.add("hide");$("perror").textContent="O Safari não conseguiu abrir o HLS convertido."},{once:true});
        }else throw new Error("Este navegador não oferece reprodução HLS nativa.");
      }catch(e){$("loading").classList.add("hide");$("perror").textContent="Não foi possível iniciar o HLS móvel. "+e.message}
    })();
    return;
  }

  // MPEG-TS live: use mpegts.js where Media Source Extensions are available.
  if(isTs(target)){
    if(window.mpegts && mpegts.isSupported()){
      player=mpegts.createPlayer(
        {type:"mpegts",isLive:true,url:src},
        {
          enableWorker:!mobile,
          enableStashBuffer:true,
          stashInitialSize:mobile?384*1024:1024*1024,
          lazyLoad:false,
          autoCleanupSourceBuffer:false,
          liveBufferLatencyChasing:false,
          liveBufferLatencyMaxLatency:12,
          liveBufferLatencyMinRemain:3,
          seekType:"range",
          accurateSeek:false,
          fixAudioTimestampGap:true
        }
      );
      player.attachMediaElement(v);
      player.on(mpegts.Events.MEDIA_INFO,()=>{
        $("loading").classList.add("hide");
        v.play().catch(()=>{});
      });
      player.on(mpegts.Events.ERROR,(a,b,c)=>{
        $("loading").classList.add("hide");
        $("perror").textContent="Erro MPEG-TS: "+a+" / "+b+(c?" / "+JSON.stringify(c):"");
      });
      player.load();
      player.play().catch(()=>{});
      return;
    }
    $("loading").classList.add("hide");
    $("perror").textContent=mobile
      ? "Este navegador móvel não disponibilizou MSE/MPEG-TS para o player. No Android, tente Chrome/Edge atualizado. No iPhone/iPad, o servidor precisa fornecer HLS (.m3u8) ou o stream precisa ser convertido no servidor."
      : "mpegts.js não está disponível neste navegador.";
    return;
  }

  // Unknown live format: let the native video element try it once.
  v.src=src;
  v.play().catch(()=>{});
}

function decodeMaybeBase64(v){try{const s=String(v||"");if(!s)return "";return /^[A-Za-z0-9+/=]+$/.test(s)&&s.length%4===0?decodeURIComponent(escape(atob(s))):s}catch{return String(v||"")}}
function fmtEpgTime(v){const n=Number(v);if(n>1000000000){const d=new Date(n*1000);return d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}const d=new Date(v);return isNaN(d)?String(v||""):d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}
async function showEpg(x){const box=$("epg");box.classList.add("hide");box.innerHTML="";if(!x||!x.stream_id)return;try{const rows=await epgInfo(x.stream_id);if(!rows.length)return;box.innerHTML='<div class="epg-title">Programação</div>'+rows.map(r=>'<div class="epg-row"><div class="epg-time">'+esc(fmtEpgTime(r.start_timestamp||r.start))+'</div><div><div class="epg-name">'+esc(decodeMaybeBase64(r.title)||"Programa")+'</div></div></div>').join("");box.classList.remove("hide")}catch{}}
async function openSeries(x){
  addHistory({...x,_page:"series"});
  $("seriesTitle").textContent=x.name||"Série";$("seriesBody").innerHTML='<div class="empty">Carregando temporadas e episódios...</div>';$("seriesModal").classList.add("open");
  try{
    const d=await seriesInfo(x.series_id);const info=d.info||{};const episodes=d.episodes||{};const seasons=Object.keys(episodes).sort((a,b)=>Number(a)-Number(b));
    if(!seasons.length)throw new Error("O provedor não retornou episódios para esta série.");
    const cover=info.cover||x.cover||x.stream_icon||"";
    $("seriesBody").innerHTML='<div class="series-hero">'+(cover?'<img class="series-cover" src="/image?url='+encodeURIComponent(cover)+'" onerror="this.style.visibility=&quot;hidden&quot;">':'<div class="series-cover"></div>')+'<div><h2 style="margin:0">'+esc(info.name||x.name||"Série")+'</h2><div class="meta">'+esc(info.genre||"")+(info.releaseDate?' · '+esc(info.releaseDate):'')+'</div><div class="series-desc">'+esc(info.plot||info.description||"Selecione uma temporada e um episódio para assistir.")+'</div></div></div><div id="seasonTabs" class="season-tabs"></div><div id="episodeList" class="episode-list"></div>';
    const tabs=$("seasonTabs"), listEl=$("episodeList");
    const renderSeason=season=>{
      tabs.querySelectorAll("button").forEach(b=>b.classList.toggle("active",b.dataset.season===String(season)));
      const eps=Array.isArray(episodes[season])?episodes[season]:[];
      listEl.innerHTML=eps.map((e,i)=>{const inf=e.info||{};return '<div class="episode" data-id="'+esc(e.id||e.stream_id||"")+'" data-ext="'+esc(e.container_extension||"mp4")+'"><div class="episode-num">E'+esc(e.episode_num||i+1)+'</div><div><div class="episode-name">'+esc(e.title||inf.name||('Episódio '+(i+1)))+'</div><div class="episode-meta">'+esc(inf.duration||inf.releasedate||"")+'</div></div><button class="episode-play">▶ Assistir</button></div>'}).join("")||'<div class="empty">Nenhum episódio nesta temporada.</div>';
      listEl.querySelectorAll(".episode").forEach((el,i)=>el.onclick=()=>{const e=eps[i];playEpisode(x,e)});
    };
    seasons.forEach((season,i)=>{const b=document.createElement("button");b.textContent="Temporada "+season;b.dataset.season=season;b.onclick=()=>renderSeason(season);if(i===0)b.classList.add("active");tabs.appendChild(b)});renderSeason(seasons[0]);
  }catch(e){$("seriesBody").innerHTML='<div class="empty">'+esc(e.message)+'</div>'}
}
function playEpisode(series,ep){
  const id=ep.id||ep.stream_id;if(!id)return;$("seriesModal").classList.remove("open");destroy();
  const ext=ep.container_extension||"mp4";const title=ep.title||((series.name||"Série")+" — Episódio "+(ep.episode_num||""));
  S.current={...ep,name:title,_page:"series",series_id:series.series_id};addHistory({...series,name:title,_page:"series",_episode_id:id});
  const target=S.server.replace(/\/+$/,'')+"/series/"+encodeURIComponent(S.user)+"/"+encodeURIComponent(S.pass)+"/"+id+"."+ext;S.target=target;
  $("ptitle").textContent=title;$("pinfo").textContent="Série: "+(series.name||"");$("perror").textContent="";$("diag").textContent="";$("epg").classList.add("hide");$("loading").classList.remove("hide");$("modal").classList.add("open");
  const src=new URL("/stream?url="+encodeURIComponent(target),window.location.href).toString(),v=$("video");
  if(/\.m3u8(?:\?|$)/i.test(target)&&window.Hls&&Hls.isSupported()){player=new Hls({enableWorker:!isMobile(),maxBufferLength:30});player.loadSource(src);player.attachMedia(v);player.on(Hls.Events.MANIFEST_PARSED,()=>{$("loading").classList.add("hide");v.play().catch(()=>{})})}else{v.src=src;v.addEventListener("loadedmetadata",()=>{$("loading").classList.add("hide");v.play().catch(()=>{})},{once:true});v.play().catch(()=>{})}
}

function buildXtreamMediaUrl(type,id,ext){
  const base=new URL(S.server);
  const prefix=base.pathname.replace(/\/+$/,'');
  base.pathname=prefix+'/'+type+'/'+encodeURIComponent(S.user)+'/'+encodeURIComponent(S.pass)+'/'+encodeURIComponent(id)+'.'+String(ext||'').replace(/^\./,'');
  base.search='';base.hash='';
  return base.toString();
}
function play(x){
  const originalPage=S.page;
  const itemPage=x._page||S.page;
  if(itemPage==="series")return openSeries(x);
  destroy();
  addHistory({...x,_page:itemPage});S.current={...x,_page:itemPage};
  const type=itemPage==="live"?"live":"movie";
  const ext=x.container_extension||(type==="live"?"ts":"mp4");
  const target=buildXtreamMediaUrl(type,x.stream_id,ext);
  S.target=target;
  $("ptitle").textContent=x.name||"Reprodução";
  $("pinfo").textContent="Origem: "+target;
  $("perror").textContent="";
  $("diag").textContent="";
  $("loading").classList.remove("hide");
  $("modal").classList.add("open");
  $("epg").classList.add("hide");
  if(itemPage==="live"){showEpg(x);return playLive(target)}
  const src=new URL("/stream?url="+encodeURIComponent(target),window.location.href).toString();
  const v=$("video");
  if(/\.m3u8(?:\?|$)/i.test(target) && window.Hls && Hls.isSupported()){
    player=new Hls({enableWorker:!isMobile(),lowLatencyMode:false,maxBufferLength:30,maxMaxBufferLength:60});
    player.loadSource(src);player.attachMedia(v);
    player.on(Hls.Events.MANIFEST_PARSED,()=>{$("loading").classList.add("hide");v.play().catch(()=>{})});
    player.on(Hls.Events.ERROR,(_,d)=>{if(d&&d.fatal){$("loading").classList.add("hide");$("perror").textContent="Erro HLS: "+(d.details||d.type||"falha")}});
  }else{
    v.src=src;
    v.addEventListener("loadedmetadata",()=>{$("loading").classList.add("hide");v.play().catch(()=>{})},{once:true});
    v.play().catch(()=>{});
  }
}

const videoEl=$("video");
videoEl.addEventListener("loadedmetadata",()=>{
  if(!S.current||S.current._page!=="movies")return;
  const p=progresses()[itemKey(S.current,"movies")];
  if(p&&p.current>10&&p.duration>30&&p.current<p.duration-20){try{videoEl.currentTime=p.current}catch{}}
});
videoEl.addEventListener("timeupdate",()=>{
  if(!S.current||S.current._page!=="movies"||!isFinite(videoEl.duration)||videoEl.duration<30)return;
  const p=progresses();p[itemKey(S.current,"movies")]={current:videoEl.currentTime,duration:videoEl.duration,updated:Date.now()};writeStore(PROGRESS_KEY,p);
});
$("diagnose").onclick=async()=>{
  if(!S.target)return;
  $("diag").textContent="Diagnosticando e seguindo redirecionamentos...";
  try{$("diag").textContent=JSON.stringify(await post("/api/diagnose-stream",{url:S.target}),null,2)}catch(e){$("diag").textContent=e.message}
};

$("close").onclick=close;
$("modal").onclick=e=>{if(e.target===$("modal"))close()};
$("seriesClose").onclick=()=>$("seriesModal").classList.remove("open");

$("search").oninput=render;
$("logout").onclick=()=>{clearSession();Object.assign(S,{server:"",user:"",pass:"",page:"live",cat:"all",view:"all",items:[],groups:[],target:"",current:null});location.reload()};
document.querySelectorAll(".lib").forEach(b=>b.onclick=()=>{document.querySelectorAll(".lib").forEach(x=>x.classList.remove("active"));b.classList.add("active");S.view=b.dataset.view;render()});
document.querySelectorAll(".nav button").forEach(b=>b.onclick=async()=>{
  document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));
  b.classList.add("active");S.page=b.dataset.page;S.view="all";document.querySelectorAll(".lib").forEach((x,i)=>x.classList.toggle("active",i===0));await load()
});

  const el=$("pinfo");
  if(!el)return;
  el.dataset.mobile=isMobile()?"1":"0";
}

updateFavCount();

if(savedSession){

  // Carrega o catálogo imediatamente com as credenciais persistidas. A validação
